<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トーナメント作成ツール</title>
    <style>
        /* 基本スタイル */
        body { font-family: sans-serif; background: #f1f5f9; padding: 10px; margin: 0; }
        .main-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .panel { background: #fff; padding: 15px; border-radius: 12px; width: 95%; max-width: 500px; }
        h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #333; text-align: left; }
        select, textarea { width: 100%; font-size: 18px; padding: 10px; box-sizing: border-box; }
        textarea { height: 350px; margin: 10px 0; resize: vertical; }
        
        /* プレースホルダー（未入力時の見本文字）を綺麗なグレーにする設定 */
        textarea::placeholder {
            color: #94a3b8;
            opacity: 1;
        }

        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { flex: 1; min-width: 130px; padding: 12px; cursor: pointer; font-size: 16px; border-radius: 8px; border: none; color: white; font-weight: bold; }
        .btn-apply { background-color: #2ecc71; }
        .btn-random { background-color: #e67e22; }
        .btn-print { background-color: #3498db; }
        .svg-container { background: #fff; padding: 10px; border-radius: 12px; width: 95%; overflow: hidden; display: flex; justify-content: center; }
        
        /* トーナメント内の選手名を明朝体にする */
        #tournament-svg text {
            font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS PMincho", serif;
            font-weight: bold;
        }

        /* 印刷用日付：画面上は隠す */
        #print-date { display: none; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { 
                position: relative;
                background: white; 
                margin: 0; 
                padding: 0; 
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
            }
            .panel { display: none !important; }
            #print-date {
                display: block !important;
                position: absolute;
                top: 0;
                right: 5mm;
                font-size: 18px;
                color: #333;
                font-weight: normal;
            }
            .svg-container { 
                display: block !important; 
                width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                box-shadow: none !important; 
                background: none !important; 
            }
            #tournament-svg { 
                display: block !important; 
                width: 100% !important; 
                height: auto !important; 
            }
        }
    </style>
</head>
<body>
    <div id="print-date"></div>

    <div class="main-container">
        <div class="panel">
            <h2>トーナメント作成ツール</h2>
            <select id="select-count" onchange="initNames()">
                <script>
                    for(let i=3; i<=16; i++) {
                        document.write(`<option value="${i}" ${i===14?'selected':''}>${i}人</option>`);
                    }
                </script>
            </select>
            <textarea id="name-area" placeholder="選手1
選手2
選手3..."></textarea>
            <div class="button-group">
                <button class="btn-apply" onclick="createTournament()">名前を反映</button>
                <button class="btn-random" onclick="createRandomTournament()">ランダムに反映</button>
                <button class="btn-print" onclick="window.print()">印刷</button>
            </div>
        </div>
        <div class="svg-container">
            <svg id="tournament-svg" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
    </div>

    <script>
        const svg = document.getElementById('tournament-svg');
        const nameArea = document.getElementById('name-area');
        const select = document.getElementById('select-count');

        function setTodayDate() {
            const today = new Date();
            const y = today.getFullYear();
            const m = today.getMonth() + 1;
            const d = today.getDate();
            document.getElementById('print-date').textContent = `${y}/${m}/${d}`;
        }

        function initNames() {
            setTodayDate();
        }

        // 配列をランダムにシャッフルする関数（Fisher-Yatesアルゴリズム）
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ランダムにシャッフルしてトーナメントを作成
        function createRandomTournament() {
            let input = nameArea.value.trim();
            if (input === "") {
                const n = parseInt(select.value);
                input = Array.from({length: n}, (_, i) => "選手 " + (i + 1)).join('\n');
                nameArea.value = input;
            }
            let names = input.split('\n').filter(s => s.trim() !== "");
            if (names.length === 0) return;

            let shuffledNames = [...names];
            shuffledNames = shuffleArray(shuffledNames);

            drawTournamentSvg(shuffledNames);
        }

        // 通常の反映用
        function createTournament() {
            let input = nameArea.value.trim();
            if (input === "") {
                const n = parseInt(select.value);
                input = Array.from({length: n}, (_, i) => "選手 " + (i + 1)).join('\n');
                nameArea.value = input;
            }
            const names = input.split('\n').filter(s => s.trim() !== "");
            if (names.length === 0) return;

            drawTournamentSvg(names);
        }

        // 実際にSVGを描画する共通処理
        function drawTournamentSvg(names) {
            svg.innerHTML = "";
            const n = names.length;

            // 16人など大人数でも上に切れないよう、高さを広げつつ高さを調整
            let LINE_H = 65;
            let svgHeight = 650;
            let baseY = 380; 

            if (n <= 4) {
                LINE_H = 100;
                svgHeight = 520;
                baseY = 250;
            } else if (n <= 8) {
                LINE_H = 80;
                svgHeight = 580;
                baseY = 320;
            }

            svg.setAttribute("viewBox", `0 0 1000 ${svgHeight}`);

            const xStep = 900 / n; 

            // 1. 各選手の文字描画（文字サイズ38px）
            const leafNodes = names.map((name, i) => {
                const x = 50 + i * xStep + xStep / 2;
                for (let j = 0; j < name.length; j++) {
                    const yPos = baseY + 45 + (j * 44); 
                    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    t.setAttribute("x", x); 
                    t.setAttribute("y", yPos);
                    t.setAttribute("text-anchor", "middle"); 
                    t.style.fontSize = "38px"; 
                    if (name[j] === 'ー') {
                        t.textContent = 'ー'; 
                        t.setAttribute("transform", `rotate(90, ${x}, ${yPos - 14})`);
                    } else { 
                        t.textContent = name[j]; 
                    }
                    svg.appendChild(t);
                }
                return { x, y: baseY, isLeaf: true };
            });

            // 2. 人数ごとの個別分割ルール
            function getSplitIndex(count) {
                switch(count) {
                    case 3:  return 2; 
                    case 4:  return 2; 
                    case 5:  return 2; 
                    case 6:  return 4; 
                    case 7:  return 4; 
                    case 8:  return 4; 
                    case 9:  return 4; 
                    case 10: return 6; 
                    case 11: return 6; 
                    case 12: return 8; 
                    case 13: return 8; 
                    case 14: return 8; 
                    case 15: return 8; 
                    case 16: return 8; 
                    default: return Math.floor(count / 2);
                }
            }

            function buildTree(list) {
                if (list.length === 1) return list[0];
                if (list.length === 2) {
                    return { left: list[0], right: list[1] };
                }

                const count = list.length;
                const mid = getSplitIndex(count);

                return {
                    left: buildTree(list.slice(0, mid)),
                    right: buildTree(list.slice(mid))
                };
            }

            const treeStructure = buildTree(leafNodes);

            // 3. 各ノードの高さ（段数）を事前算出
            function calculateHeights(node) {
                if (node.isLeaf) {
                    node.height = 0;
                    return 0;
                }
                const hL = calculateHeights(node.left);
                const hR = calculateHeights(node.right);
                node.height = Math.max(hL, hR) + 1;
                return node.height;
            }
            calculateHeights(treeStructure);

            // 4. 線を描画
            function drawTree(node) {
                if (node.isLeaf) return node;

                const leftRes = drawTree(node.left);
                const rightRes = drawTree(node.right);

                const joinY = baseY - (node.height * LINE_H);

                line(leftRes.x, leftRes.y, leftRes.x, joinY);
                line(rightRes.x, rightRes.y, rightRes.x, joinY);
                line(leftRes.x, joinY, rightRes.x, joinY);

                const parentX = (leftRes.x + rightRes.x) / 2;
                return { x: parentX, y: joinY };
            }

            const root = drawTree(treeStructure);

            // 優勝線
            if (root) {
                line(root.x, root.y, root.x, root.y - 25);
            }
        }

        function line(x1, y1, x2, y2) {
            const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
            l.setAttribute("stroke", "black"); 
            l.setAttribute("stroke-width", "2");
            l.setAttribute("x1", x1); 
            l.setAttribute("y1", y1);
            l.setAttribute("x2", x2); 
            l.setAttribute("y2", y2);
            svg.appendChild(l);
        }

        window.onload = function() {
            setTodayDate();
        };
    </script>
</body>
</html>
